name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sqlite is required by the DataTable tests (testbench builds an
          # in-memory SQLite schema); declare extensions explicitly so the job
          # never depends on the runner's defaults.
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pest
        run: ./vendor/bin/pest

  js-tests:
    name: JS (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:js

      - name: Build assets
        run: npm run build

      # "El JavaScript es poco" es una promesa de la documentación. Una promesa que nadie
      # mide deja de ser verdad sin que nadie se entere.
      - name: Check bundle size
        run: npm run size

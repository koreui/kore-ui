name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sqlite is required by the DataTable tests (testbench builds an
          # in-memory SQLite schema); declare extensions explicitly so the job
          # never depends on the runner's defaults.
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pest
        run: ./vendor/bin/pest

  js-tests:
    name: JS (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:js

      # El modo markdown del editor tiene DOS parsers: uno pinta lo que se ve al
      # editar y otro fabrica el HTML que se publica. Si se toca uno sin el otro,
      # lo escrito se ve de una manera y se publica de otra, y eso no lo detecta
      # ningún test de los dos lados por separado: cada uno pasa con su propia
      # idea de la verdad.
      - name: Check both markdown parsers agree
        run: npm run markdown:check

      # dist/kore-ui.js va versionado: el ServiceProvider lo sirve tal cual desde el paquete
      # instalado, sin que el proyecto que usa la librería construya nada. Este paso corre
      # ANTES del build a propósito — después, el dist siempre está fresco y no comprueba nada.
      - name: Check dist/ is in sync with sources
        run: npm run dist:check

      - name: Build assets
        run: npm run build

      # Y esto atrapa lo que el chequeo semántico no ve: cambios dentro de un componente que
      # ya estaba registrado. Si el build produce algo distinto de lo commiteado, el dist
      # está atrasado.
      - name: Verify committed dist/ matches the build
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/kore-ui.js no coincide con el build de resources/js/."
            echo "Ejecuta 'npm run build' y commitea dist/kore-ui.js."
            git diff --stat -- dist/
            exit 1
          fi

      # "El JavaScript es poco" es una promesa de la documentación. Una promesa que nadie
      # mide deja de ser verdad sin que nadie se entere.
      - name: Check bundle size
        run: npm run size
